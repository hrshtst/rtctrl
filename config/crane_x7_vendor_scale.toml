# CRANE-X7 deployment configuration — VENDOR-EQUIVALENT COMMAND SCALE.
#
# Identical to crane_x7.toml except for the per-joint
# command_torque_scale: the vendor-derived calibration HYPOTHESES of
# docs/records/history.md (gravity calibration) (full ratios of the nominal
# electrical constants to rt_manipulators' empirically tuned ones):
#   XM430-W350: 1.783 / 2.20 = 0.810455
#   XM540-W270: 2.409 / 3.60 = 0.669167
# The torque boundary emits i = scale * tau / kt_nominal, so these
# ATTENUATE every torque-representing current by ~19% / ~33%.
# Mandatory for the M-GC3 hardware float test; NOT the default until
# that test passes and the reviewer + owner adopt it.
#
[bus]
port = "/dev/ttyUSB0"
baudrate = 3000000

[[joint]]
name = "crane_x7_shoulder_fixed_part_pan_joint"
id = 2
model = "XM430-W350"
operating_mode = 3
velocity_limit = 4.81710873  # rad/s
effort_limit = 10.0          # Nm
pos_limit_margin = 0.0       # rad
current_limit_margin = 0.5   # A
command_torque_scale = 0.810455

[[joint]]
name = "crane_x7_shoulder_revolute_part_tilt_joint"
id = 3
model = "XM540-W270"
operating_mode = 3
velocity_limit = 4.81710873
effort_limit = 10.0
pos_limit_margin = 0.0
current_limit_margin = 0.5
command_torque_scale = 0.669167

